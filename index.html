<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        /* 全体の設定 */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            background-color: #ffffff;
            color: #666; /* 文字色は少しグレー */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 500px;
        }

        /* ヘッダー部分 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .id-name {
            font-size: 24px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-image: url('https://placehold.jp/80x80.png'); /* ここに月の画像のURLを入れる */
            background-size: cover;
        }

        /* ボタン部分 */
        .buttons {
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: #e0e0e0;
            color: #fff;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            margin-right: 10px;
            letter-spacing: 0.1em;
        }

        /* コンテンツ部分 */
        .content {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .section-title {
            background-color: #e9d5d5; /* 薄いピンク */
            color: #fff;
            padding: 2px 5px;
            font-style: italic;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        .column {
            width: 45%;
        }

        .item-row {
            display: flex;
            margin-bottom: 5px;
        }

        .label {
            width: 60px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="id-name">@C0SMON</div>
        <div class="icon"></div>
    </header>

    <div class="buttons">
        <span class="btn">ABOUT</span>
        <span class="btn">ATTENTION</span>
    </div>

    <div class="content">
        <div class="column">
            <div class="section-title">GENERAL</div>
            <div>
                <strong>cosmon</strong> こすも / もん<br>
                昼神幸郎くんのりあこ<br><br>
                ほんあかです FRBご自由に<br>
                タメも敬語も気にしません
            </div>
        </div>

        <div class="column">
            <div class="section-title">LIKES</div>
            <div class="item-row"><span class="label">HQ</span><span>昼神家 鴎台</span></div>
            <div class="item-row"><span class="label">テニミュ</span><span>3rd山吹 青11</span></div>
            <div class="item-row"><span class="label">V</span><span>卯月コウ</span></div>
            <div class="item-row"><span class="label">同人作品</span><span>KNOCK永街</span></div>
            <div class="item-row"><span class="label">音楽</span><span>HASAMI_group</span></div>
        </div>
    </div>
</div>

</body>
</html>
