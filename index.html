<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            background-color: #ffffff;
            color: #666;
            margin: 0;
            display: flex;
            justify-content: center;
            padding-top: 100px;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 450px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .id-name {
            font-size: 24px;
            letter-spacing: 0.3em;
            color: #8899aa;
        }

        .icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-image:url('https://github.com/oursblancq/study_python/blob/main/IMG_2591.jpeg')
            background-size: cover;
        }

        .buttons {
            margin-bottom: 30px;
        }

        /* ボタンのスタイル */
        .btn {
            display: inline-block;
            background-color: #d1d5db;
            color: #fff;
            padding: 5px 25px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
            border: none;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #bbc1cc;
        }

        /* コンテンツの初期設定：最初は非表示 */
        .tab-content {
            display: none;
            animation: fadeIn 0.5s;
        }

        /* アクティブな時だけ表示 */
        .tab-content.active {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .section-title {
            background-color: #a899b3;
            color: #fff;
            padding: 2px 8px;
            font-style: italic;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 11px;
        }

        .column {
            width: 48%;
            font-size: 11px;
        }

        /* ATTENTION用のカードスタイル */
        .att-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .att-card {
            border: 1px solid #eee;
            padding: 10px;
            position: relative;
        }

        .att-num {
            color: #e9d5d5;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #eee;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="id-name">@i_m_nr_</div>
        <div class="icon"></div>
    </header>

    <div class="buttons">
        <button class="btn" onclick="showTab('about')">information</button>
        <button class="btn" onclick="showTab('attention')">attention</button>
    </div>

    <div id="about" class="tab-content">
        <div class="column">
            <div class="section-title">about</div>
            <div>
                <strong>練る</strong><br>
                実在する人物のお名前をお借りしていますが、空想に過ぎないことを十分にご理解下さい。<br>
            </div>
        </div>
        <div class="column">
            <div class="section-title">pass</div>
            <div>全部夢のまま：0501</div>
        </div>
    </div>

    <div id="attention" class="tab-content">
        <div class="att-grid">
            <div class="att-card">
                <div class="att-num">OK</div>
                <div style="font-size: 10px;">誤字脱字報告、優しい感想、リクエストなど承っております</div>
            </div>
            <div class="att-card">
                <div class="att-num">NG</div>
                <div style="font-size: 10px;">誹謗中傷、公共のデバイスを使用した閲覧、晒し行為、転載はおやめください</div>
            </div>
        </div>
    </div>
</div>

<script>
    function showTab(tabId) {
        // すべてのコンテンツを一度隠す
        const contents = document.querySelectorAll('.tab-content');
        contents.forEach(content => content.classList.remove('active'));
        
        // クリックされたものだけ表示する
        const activeContent = document.getElementById(tabId);
        activeContent.classList.add('active');
    }
    
    // 最初はABOUTを表示しておく
    showTab('about');
</script>

</body>
</html>
